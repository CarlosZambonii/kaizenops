apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaizenops.fullname" . }}-collector
  labels:
    {{- include "kaizenops.componentLabels" (dict "ctx" $ "component" "collector") | nindent 4 }}
spec:
  replicas: {{ .Values.collector.replicaCount }}
  selector:
    matchLabels:
      {{- include "kaizenops.componentSelectorLabels" (dict "ctx" $ "component" "collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaizenops.componentSelectorLabels" (dict "ctx" $ "component" "collector") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.collector.service.port }}
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: {{ .Values.collector.httpAddr | quote }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName }}
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName }}
                  key: GITHUB_APP_PRIVATE_KEY
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName }}
                  key: GITHUB_WEBHOOK_SECRET
            - name: PSEUDONYM_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName }}
                  key: PSEUDONYM_SALT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
