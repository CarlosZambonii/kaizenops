# ServiceAccounts dedicados por componente do KaizenOps.
#
# RBAC mínimo: nenhum componente (collector, spc, ml) precisa falar com a API
# do Kubernetes em tempo de execução — eles conversam entre si por HTTP
# (collector -> TimescaleDB, spc -> TimescaleDB/New Relic, spc/collector ->
# ml service), nunca com o kube-apiserver. Por isso, propositalmente, NÃO há
# Role nem RoleBinding neste arquivo: dar qualquer permissão de API que não
# será usada violaria least privilege. Se algum componente algum dia precisar
# de acesso à API (ex.: leitura de ConfigMap/Secret dinâmica), crie a
# Role/RoleBinding específica naquele momento, com o menor escopo possível —
# não antecipe permissão "para garantir".
#
# automountServiceAccountToken: false em todas: como não há uso da API do
# Kubernetes, o token de ServiceAccount não deve nem existir montado no pod.
# Isso remove uma credencial que, se nunca usada, é só superfície de ataque.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kaizenops.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaizenops.componentLabels" (dict "ctx" $ "component" "collector") | nindent 4 }}
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kaizenops.fullname" . }}-spc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaizenops.componentLabels" (dict "ctx" $ "component" "spc") | nindent 4 }}
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kaizenops.fullname" . }}-ml
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaizenops.componentLabels" (dict "ctx" $ "component" "ml") | nindent 4 }}
automountServiceAccountToken: false
