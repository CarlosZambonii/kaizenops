name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "terraform/**"
      - "docs/**"
      - "*.md"

permissions:
  contents: read

env:
  COSIGN_EXPERIMENTAL: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  build-and-sign:
    name: build-and-sign
    needs: [test, gosec, trivy-fs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- collector ---

      - name: Build and push kaizenops-collector
        id: build-collector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/collector/Dockerfile
          push: true
          tags: |
            ghcr.io/carloszambonii/kaizenops-collector:${{ github.sha }}
            ghcr.io/carloszambonii/kaizenops-collector:latest

      - name: Scan kaizenops-collector image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/carloszambonii/kaizenops-collector:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      # --- spc ---

      - name: Build and push kaizenops-spc
        id: build-spc
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/spc/Dockerfile
          push: true
          tags: |
            ghcr.io/carloszambonii/kaizenops-spc:${{ github.sha }}
            ghcr.io/carloszambonii/kaizenops-spc:latest

      - name: Scan kaizenops-spc image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/carloszambonii/kaizenops-spc:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      # --- ml ---

      - name: Build and push kaizenops-ml
        id: build-ml
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ml/api/Dockerfile
          push: true
          tags: |
            ghcr.io/carloszambonii/kaizenops-ml:${{ github.sha }}
            ghcr.io/carloszambonii/kaizenops-ml:latest

      - name: Scan kaizenops-ml image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/carloszambonii/kaizenops-ml:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore

      # --- keyless signing (Cosign, OIDC do proprio job, sem secret) ---

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign kaizenops-collector
        run: cosign sign --yes ghcr.io/carloszambonii/kaizenops-collector@${{ steps.build-collector.outputs.digest }}

      - name: Sign kaizenops-spc
        run: cosign sign --yes ghcr.io/carloszambonii/kaizenops-spc@${{ steps.build-spc.outputs.digest }}

      - name: Sign kaizenops-ml
        run: cosign sign --yes ghcr.io/carloszambonii/kaizenops-ml@${{ steps.build-ml.outputs.digest }}
